name: Release new version

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. 2.5.1+mc26.1)"
        required: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Temurin 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: Upload Fabric jar to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: fabric/build/libs/tiertagger-*+mc26.1.jar

      - name: Upload NeoForge jar to GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.event_name == 'release'
        with:
          files: neoforge/build/libs/tiertagger-*+mc26.1.jar

      - name: Publish to Modrinth
        run: ./gradlew modrinth
        if: github.event_name == 'release'
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}


name: Build snapshot

on:
  push:
    branches: ["26.1.1"]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Setup Temurin 25
        uses: actions/setup-java@v4
        with:
          java-version: 25
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build
        run: ./gradlew build

      - name: List built jars
        run: find . -path '*/build/libs/*.jar' ! -name '*-dev.jar' ! -name '*-sources.jar' ! -name '*-all.jar' | sort

      - name: Upload Fabric artifact
        uses: actions/upload-artifact@v4
        with:
          name: TierTagger-fabric-26.1.1
          path: fabric/build/libs/tiertagger-*.jar
          if-no-files-found: warn

      - name: Upload NeoForge artifact
        uses: actions/upload-artifact@v4
        with:
          name: TierTagger-neoforge-26.1.1
          path: neoforge/build/libs/tiertagger-*.jar
          if-no-files-found: warn

